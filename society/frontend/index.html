<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Society Tasks</title><link rel="stylesheet" href="./styles.css"></head><body><div class="shell"><section id="login-view" class="login-card"><div class="eyebrow">PAYAL HEIGHTS • OPERATIONS</div><h1>Society Tasks</h1><p class="muted">Private workspace for committee and management operations.</p><form id="login-form"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="login-error" class="error"></p></form></section><section id="app-view" hidden><header class="topbar"><div><div class="eyebrow">PAYAL HEIGHTS • OPERATIONS</div><h1>Task Control</h1></div><div class="userbox"><span id="user-name"></span><span id="user-role" class="pill"></span><button id="logout" class="ghost">Sign out</button></div></header><main><div id="stats" class="stats"></div><section id="create-panel" class="panel" hidden><div class="panel-head"><div><h2>Assign a task</h2><p class="muted">New work is routed to the active Manager.</p></div></div><form id="task-form" class="task-form"><input id="title" placeholder="Task title" maxlength="200" required><textarea id="description" placeholder="Description / instructions" maxlength="10000"></textarea><div class="form-row"><select id="priority"><option>MEDIUM</option><option>LOW</option><option>HIGH</option><option>URGENT</option></select><input id="due-date" type="date"><button>Create task</button></div></form></section><section class="panel"><div class="panel-head"><div><h2>Work queue</h2><p class="muted">Live task status and review workflow.</p></div><button id="refresh" class="ghost">Refresh</button></div><div id="tasks" class="tasks"></div></section></main></section></div><script src="./app.js" defer></script></body></html>
