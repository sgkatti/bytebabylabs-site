name: Society Platform Tests

on:
  pull_request:
    paths:
      - "society/**"
      - ".github/workflows/society-test.yml"
  push:
    branches:
      - main
      - "feature/society-task-platform-*"
    paths:
      - "society/**"
      - ".github/workflows/society-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: society/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: society/backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
